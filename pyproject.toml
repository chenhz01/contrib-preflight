[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "contrib-preflight"
version = "0.1.0"
description = "Zero-dependency integrity preflight for repositories and MCP backends: catch supply-chain, release-drift and resource-lifecycle defects before you merge or boot."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "contrib-preflight contributors" }]
keywords = [
  "code-review",
  "supply-chain",
  "github-actions",
  "preflight",
  "mcp",
  "lint",
  "release-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cpreflight = "cpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/cpreflight/contrib-preflight"
Issues = "https://github.com/cpreflight/contrib-preflight/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cpreflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
